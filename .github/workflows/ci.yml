name: Hikari Protocol Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-contracts:
    name: Soroban Smart Contracts Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Run Cargo Test Suite
        run: cargo test --manifest-path contracts/Cargo.toml --workspace

  node-test-suite:
    name: TypeScript SDK, Engine & Mathematical Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm install --prefix engine
          npm install --prefix agents
          npm install --prefix sdk
          npm install --prefix services/x402-gateway

      - name: Build TypeScript Packages
        run: |
          npm run build --prefix engine
          npm run build --prefix agents
          npm run build --prefix sdk
          npm run build --prefix services/x402-gateway

      - name: Run Developer SDK Tests
        run: npm test --prefix sdk

      - name: Run Policy & Risk Engine Tests
        run: npm test --prefix engine

      - name: Run 10,000-Iteration Property-Based Invariant Fuzzing
        run: node scripts/run_fuzz_tests.js

      - name: Run 365-Day Historical Market Backtest
        run: node scripts/run_backtest.js

      - name: Verify Points & Shards Multiplier Engine
        run: node scripts/verify_points_engine.js

      - name: Verify Web Dashboard & Decoupled Navigation
        run: |
          node frontend/server.js &
          sleep 3
          node scripts/verify_ui.js

  docker-validation:
    name: Dockerfile Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: hikari-protocol:ci-test
